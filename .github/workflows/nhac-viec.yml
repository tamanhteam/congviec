name: Nhắc việc hằng ngày

on:
  schedule:
    # 00:30 UTC = 07:30 giờ Việt Nam, chạy mỗi ngày
    - cron: '30 0 * * *'
  workflow_dispatch:        # cho phép bấm chạy thử bằng tay

jobs:
  nhac-viec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gửi cảnh báo lên Telegram
        env:
          SHEET_ID: 15S-iIk5J0OafEAauoLV2oaaKwMc4xzPH_0m0kQAR1pM
          SHEET_GID: '1955195620'
          WEB_URL: https://tamanhteam.github.io/congviec/
          SOON_DAYS: '3'
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .github/scripts/nhac-viec.js
